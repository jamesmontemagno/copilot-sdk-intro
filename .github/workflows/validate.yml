name: Validate samples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: dotnet
            name: .NET smoke build
          - language: nodejs
            name: Node.js / TypeScript smoke build
          - language: python
            name: Python smoke build
          - language: go
            name: Go smoke build
          - language: java
            name: Java smoke build
          - language: rust
            name: Rust smoke build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'dotnet'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        if: matrix.language == 'nodejs'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum

      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'rust'
        with:
          workspaces: rust -> ../.cargo-target

      - name: Build .NET sample
        if: matrix.language == 'dotnet'
        run: dotnet build dotnet/CopilotSdkLiveDemo.csproj --nologo

      - name: Build Node.js sample
        if: matrix.language == 'nodejs'
        working-directory: nodejs
        run: |
          npm ci
          npm run build

      - name: Compile Python sample
        if: matrix.language == 'python'
        working-directory: python
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile main.py model_selector.py merge_conflict_tools.py permission_prompt.py

      - name: Build Go sample
        if: matrix.language == 'go'
        working-directory: go
        run: go test ./...

      - name: Compile Java sample
        if: matrix.language == 'java'
        working-directory: java
        run: mvn -B -q -DskipTests compile

      - name: Check Rust sample
        if: matrix.language == 'rust'
        working-directory: rust
        run: cargo check --locked
